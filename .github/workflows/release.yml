# Pushing a v* tag publishes a release. The tag has to agree with the version
# in Cargo.toml / Cargo.lock / flake.nix, and the build is the same one CI runs,
# pushed to the cache so `nix run github:mtul0729/cosmic-desktop-mcp` substitutes.
#
# No binary is attached: the package is a Nix wrapper around the Rust binary, so a
# tarball of it would not run outside the store. The release notes are the record;
# the artefact is the cache.
name: Release

on:
  push:
    tags: ["v*"]

permissions:
  contents: write

jobs:
  release:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7

      - uses: ./.github/actions/setup
        with:
          cachix-auth-token: ${{ secrets.CACHIX_AUTH_TOKEN }}

      - name: Tag matches the version
        run: ./scripts/check-version.sh --tag "$GITHUB_REF_NAME"

      - name: Check and build
        run: |
          nix flake check --all-systems --accept-flake-config
          nix build .#default --accept-flake-config -L

      - name: Publish
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          set -euo pipefail
          if gh release view "$GITHUB_REF_NAME" >/dev/null 2>&1; then
            echo "release $GITHUB_REF_NAME already exists, leaving it alone"
            exit 0
          fi
          gh release create "$GITHUB_REF_NAME" \
            --title "$GITHUB_REF_NAME" \
            --generate-notes \
            --verify-tag
