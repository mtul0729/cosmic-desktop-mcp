[package]
name = "cosmic-desktop-mcp"
version = "0.2.1"
edition = "2024"
rust-version = "1.95.0"
license = "MIT"
description = "MCP server that drives a COSMIC/Wayland desktop: screenshots, window list, pointer and keyboard input"
repository = "https://github.com/mtul0729/cosmic-desktop-mcp"
default-run = "cosmic-desktop-mcp"

[dependencies]
anyhow = "1"
libc = "0.2"
serde = { version = "1", features = ["derive"] }
serde_json = "1"
image = { version = "0.25", default-features = false, features = ["png"] }
wayland-client = "0.31"
# `staging` carries ext-image-copy-capture, ext-foreign-toplevel-list and
# pointer-warp. COSMIC implements all three; nothing here needs a private
# zcosmic_* protocol.
wayland-protocols = { version = "0.32", features = ["client", "staging"] }
# Generated bindings for the COSMIC protocol extensions. Only `client` is
# needed; the crate ships the XML it scans, so this adds no build.rs of ours.
# `zcosmic_toplevel_info_v1` is the one protocol that carries window geometry.
cosmic-protocols = { version = "0.2", default-features = false, features = ["client"] }
# Optional libei backend. The RemoteDesktop portal hands out an EIS socket,
# which the compositor treats as a remote-desktop session rather than as a new
# input device. `reis` is the Rust EI/EIS implementation (same one libei ships).
# `screencast` is not optional in practice: remote_desktop refers to its
# Stream type unconditionally, so enabling remote_desktop alone fails to
# compile (ashpd 0.13.13).
ashpd = { version = "0.13", features = ["remote_desktop", "screencast"] }
reis = "0.7"
tokio = { version = "1", features = ["rt", "time"] }

[profile.release]
lto = "thin"
strip = true
